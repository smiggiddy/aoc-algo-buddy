# XcodeGen spec. Regenerate with:  xcodegen generate
#
# The app target lives here; everything else lives in the local SlateKit
# SwiftPM package so it stays buildable and testable without Xcode.
name: Slate
options:
  bundleIdPrefix: dev.slate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

packages:
  SlateKit:
    path: .

targets:
  Slate:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Sources/SlateApp
      - path: Resources
        optional: true
    dependencies:
      - package: SlateKit
        product: SlateKit
    settings:
      base:
        PRODUCT_NAME: Slate
        PRODUCT_BUNDLE_IDENTIFIER: dev.slate.terminal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # iPad is the primary target; iPhone works but the layout assumes width.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        # ios_system commands ship as embedded (not linked) frameworks.
        # Add them under `embedFrameworks` once you vendor them.
        OTHER_LDFLAGS: "-ObjC"
